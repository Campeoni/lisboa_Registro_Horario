version: '3.9'
services:
  lisboa-postgres:
    image: postgres:17.2
    restart: unless-stopped
    container_name: lisboa-postgres
    ports:
      - 5433:5432
    environment:
      - POSTGRES_DB=lisboa-registro
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
