<mat-card>
  <mat-card-header>
    <mat-card-title>Locales</mat-card-title>
    <mat-card-subtitle>Gestion de ubicaciones</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <div class="card-actions">
      <button mat-raised-button color="primary" routerLink="new">
        <mat-icon>add</mat-icon>
        Nuevo Local
      </button>
    </div>

    <table mat-table [dataSource]="locations()" class="full-width">
      <ng-container matColumnDef="code">
        <th mat-header-cell *matHeaderCellDef>Codigo</th>
        <td mat-cell *matCellDef="let row" class="clickable" (click)="view(row)">
          {{ row.code }}
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th mat-header-cell *matHeaderCellDef>Nombre</th>
        <td mat-cell *matCellDef="let row" class="clickable" (click)="view(row)">
          {{ row.name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="address">
        <th mat-header-cell *matHeaderCellDef>Direccion</th>
        <td mat-cell *matCellDef="let row" class="clickable" (click)="view(row)">
          {{ row.address || '-' }}
        </td>
      </ng-container>

      <ng-container matColumnDef="geofenceRadiusMeters">
        <th mat-header-cell *matHeaderCellDef>Radio (m)</th>
        <td mat-cell *matCellDef="let row" class="clickable" (click)="view(row)">
          {{ row.geofenceRadiusMeters }}
        </td>
      </ng-container>

      <ng-container matColumnDef="isActive">
        <th mat-header-cell *matHeaderCellDef>Estado</th>
        <td mat-cell *matCellDef="let row" class="clickable" (click)="view(row)">
          <mat-chip
            [color]="row.isActive ? 'accent' : 'warn'"
            variant="outlined"
          >
            {{ row.isActive ? 'Activo' : 'Inactivo' }}
          </mat-chip>
        </td>
      </ng-container>

      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>Acciones</th>
        <td mat-cell *matCellDef="let row">
          <button mat-icon-button [routerLink]="['/locations', row.id, 'personnel']" color="primary">
            <mat-icon>people</mat-icon>
          </button>
          <button mat-icon-button [routerLink]="[row.id]" color="primary">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button (click)="delete(row.id)" color="warn">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
        class="clickable-row"
      ></tr>
    </table>
  </mat-card-content>
</mat-card>
